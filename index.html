<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.E.M. 邓紫棋粉丝网站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #D9C3E8;
    color: #3d2a4a;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* 顶栏：只做左右分区，导航整体靠右 */
  .topbar {
    background: #D9C3E8;
    border-bottom: 1px solid #b89cc9;
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* 左上角只有这一行文字 */
  .brand {
    font-size: 16px;
    font-weight: 600;
    color: #4a2e5e;
    white-space: nowrap;
  }

  /* 右上角一组：导航 + 语言，全部靠右 */
  .top-right {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .nav-links {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  .nav-links a {
    color: #4a2e5e;
    text-decoration: none;
    font-size: 14px;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .nav-links a:hover {
    border-bottom-color: #4a2e5e;
    color: #1f0f2b;
  }

  .lang {
    position: relative;
    cursor: pointer;
    color: #4a2e5e;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
  }

  .lang:hover { color: #1f0f2b; }

  .lang-dropdown {
    display: none;
    position: absolute;
    top: 26px;
    right: 0;
    background: #D9C3E8;
    border: 1px solid #b89cc9;
    border-radius: 4px;
    min-width: 110px;
    padding: 4px 0;
    z-index: 10;
  }

  .lang-dropdown a {
    display: block;
    padding: 6px 14px;
    color: #4a2e5e;
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
  }

  .lang-dropdown a:hover { background: #c9aede; }
  .lang:hover .lang-dropdown { display: block; }

  /* 主内容：作品/专辑入口，不是动态流 */
  .main {
    padding: 48px 28px 90px;
    max-width: 960px;
    margin: 0 auto;
  }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: #5c3d72;
    letter-spacing: 1px;
    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #b89cc9;
  }

  .album-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }

  .album-item {
    background: #e6d5f0;
    border: 1px solid #c9aede;
    border-radius: 4px;
    padding: 22px 14px;
    text-align: center;
    transition: background 0.15s;
  }

  .album-item:hover { background: #dcc8ea; }

  .album-name {
    font-weight: 600;
    margin-bottom: 4px;
  }

  .album-year {
    font-size: 12px;
    color: #7a5c8f;
  }

  /* 右下角非官方声明 */
  .disclaimer {
    position: fixed;
    bottom: 14px;
    right: 18px;
    font-size: 12px;
    color: #6b4f7d;
    background: rgba(217, 195, 232, 0.9);
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid #b89cc9;
    z-index: 999;
  }

  @media (max-width: 760px) {
    .topbar {
      flex-direction: column;
      height: auto;
      padding: 10px 16px;
      gap: 8px;
      align-items: flex-start;
    }
    .top-right {
      width: 100%;
      justify-content: space-between;
      gap: 12px;
    }
    .nav-links { gap: 12px; flex-wrap: wrap; }
    .main { padding: 28px 16px 80px; }
    .disclaimer { bottom: 8px; right: 8px; font-size: 11px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">G.E.M. 邓紫棋粉丝网站</div>

  <div class="top-right">
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="tour.html">巡演</a>
      <a href="shemei.html">社媒</a>
      <a href="https://cn.iamgem.com" target="_blank">官方产品</a>
      <a href="lianxi.html">联系</a>
    </nav>

    <div class="lang">
      🌐
      <div class="lang-dropdown">
        <a href="index.html">简体中文</a>
        <a href="index-en.html">English</a>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="section-title">作品</div>
  <div class="album-grid">
    <div class="album-item"><div class="album-name">G.E.M.-EP</div><div class="album-year">2008</div></div>
    <div class="album-item"><div class="album-name">18...</div><div class="album-year">2009</div></div>
    <div class="album-item"><div class="album-name">My Secret</div><div class="album-year">2010</div></div>
    <div class="album-item"><div class="album-name">Xposed</div><div class="album-year">2012</div></div>
    <div class="album-item"><div class="album-name">新的心跳</div><div class="album-year">2015</div></div>
    <div class="album-item"><div class="album-name">童话三部曲（另一个童话&毒苹果&睡皇后）</div><div class="album-year">2018</div></div>
    <div class="album-item"><div class="album-name">摩天动物园</div><div class="album-year">2019</div></div>
    <div class="album-item"><div class="album-name">启示录</div><div class="album-year">2022</div></div>
    <div class="album-item"><div class="album-name">T.I.M.E.-EP</div><div class="album-year">2023</div></div>
  </div>
</main>

<div class="disclaimer">此网站非官方网站，请仔细甄别</div>

</body>
</html>
