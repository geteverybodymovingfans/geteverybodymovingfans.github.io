<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.E.M. 邓紫棋粉丝网站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #D9C3E8; /* 拼豆 D9 浅紫 */
    color: #3d2a4a;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* 顶部栏：浅紫底，下方细线 */
  .topbar {
    background: #D9C3E8;
    border-bottom: 1px solid #b89cc9;
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* 左上角文字 */
  .brand {
    font-size: 16px;
    font-weight: 600;
    color: #4a2e5e;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  /* 右上角：导航 + 语言 */
  .nav-area {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .nav-links {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  .nav-links a {
    color: #4a2e5e;
    text-decoration: none;
    font-size: 14px;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s, color 0.15s;
  }

  .nav-links a:hover {
    color: #1f0f2b;
    border-bottom-color: #4a2e5e;
  }

  /* 语言切换：小地球 + 下拉 */
  .lang {
    position: relative;
    cursor: pointer;
    color: #4a2e5e;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
  }

  .lang:hover { color: #1f0f2b; }

  .lang-dropdown {
    display: none;
    position: absolute;
    top: 26px;
    right: 0;
    background: #D9C3E8;
    border: 1px solid #b89cc9;
    border-radius: 4px;
    min-width: 110px;
    padding: 4px 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .lang-dropdown a {
    display: block;
    padding: 6px 14px;
    color: #4a2e5e;
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
  }

  .lang-dropdown a:hover {
    background: #c9aede;
  }

  .lang:hover .lang-dropdown { display: block; }

  /* 主内容区：留白，不搞大标题 */
  .main {
    padding: 40px 28px;
    max-width: 900px;
  }

  .main h2 {
    font-size: 18px;
    font-weight: 600;
    color: #4a2e5e;
    margin-bottom: 16px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: #e6d5f0; /* 比 D9 稍浅一点，区分卡片 */
    border: 1px solid #c9aede;
    border-radius: 6px;
    padding: 14px 18px;
    color: #3d2a4a;
    font-size: 14px;
  }

  .card .date {
    font-size: 12px;
    color: #7a5c8f;
    margin-right: 8px;
  }

  /* 右下角非官方声明 */
  .disclaimer {
    position: fixed;
    bottom: 14px;
    right: 18px;
    font-size: 12px;
    color: #6b4f7d;
    background: rgba(217, 195, 232, 0.85);
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid #b89cc9;
    z-index: 999;
  }

  @media (max-width: 760px) {
    .topbar {
      flex-direction: column;
      height: auto;
      padding: 10px 16px;
      gap: 8px;
      align-items: flex-start;
    }
    .nav-area {
      width: 100%;
      justify-content: space-between;
      gap: 8px;
    }
    .nav-links { gap: 12px; flex-wrap: wrap; }
    .main { padding: 28px 16px; }
    .disclaimer { bottom: 8px; right: 8px; font-size: 11px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">G.E.M. 邓紫棋粉丝网站</div>

  <div class="nav-area">
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="tour.html">巡演</a>
      <a href="semei.html">社媒</a>
      <a href="https://cn.iamgem.com" target="_blank">官方产品</a>
      <a href="lianxi.html">联系</a>
    </nav>

    <div class="lang">
      🌐
      <div class="lang-dropdown">
        <a href="index.html">简体中文</a>
        <a href="index-en.html">English</a>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <h2>最新动态</h2>
  <div class="card-list">
    <div class="card"><span class="date">2025-11</span>I AM GLORIA 巡演最新场次信息待更新</div>
    <div class="card"><span class="date">2025-10</span>新歌/合作动态占位，可替换为文字摘要与外链</div>
    <div class="card"><span class="date">—</span>本站为粉丝自发建立，资讯仅供交流参考</div>
  </div>
</main>

<div class="disclaimer">此网站非官方网站，请仔细甄别</div>

</body>
</html>
