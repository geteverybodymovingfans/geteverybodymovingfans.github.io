<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.E.M.邓紫棋粉丝网站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #D9C3E8;
    color: #3d2a4a;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .topbar {
    background: #D9C3E8;
    border-bottom: 1px solid #b89cc9;
    padding: 0 28px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-size: 16px;
    font-weight: 600;
    color: #4a2e5e;
    white-space: nowrap;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .nav-links {
    display: flex;
    gap: 18px;
    align-items: center;
  }

  .nav-links a {
    color: #4a2e5e;
    text-decoration: none;
    font-size: 14px;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .nav-links a:hover {
    border-bottom-color: #4a2e5e;
    color: #1f0f2b;
  }

  .lang {
    position: relative;
    cursor: pointer;
    color: #4a2e5e;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
  }

  .lang:hover { color: #1f0f2b; }

  .lang-dropdown {
    display: none;
    position: absolute;
    top: 26px;
    right: 0;
    background: #D9C3E8;
    border: 1px solid #b89cc9;
    border-radius: 4px;
    min-width: 110px;
    padding: 4px 0;
    z-index: 10;
  }

  .lang-dropdown a {
    display: block;
    padding: 6px 14px;
    color: #4a2e5e;
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
  }

  .lang-dropdown a:hover { background: #c9aede; }
  .lang:hover .lang-dropdown { display: block; }

  .main {
    padding: 48px 28px 90px;
    max-width: 960px;
    margin: 0 auto;
  }

  .welcome {
    font-size: 20px;
    font-weight: 600;
    color: #4a2e5e;
    margin-bottom: 28px;
  }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: #5c3d72;
    letter-spacing: 1px;
    margin-bottom: 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #b89cc9;
  }

  .album-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }

  /* 可点击卡片通用样式 */
  .album-item {
    display: block;
    background: #e6d5f0;
    border: 1px solid #c9aede;
    border-radius: 4px;
    padding: 22px 14px;
    text-align: center;
    transition: background 0.15s;
    color: #3d2a4a;
    text-decoration: none;
    cursor: pointer;
  }

  .album-item:hover { background: #dcc8ea; }

  .album-name {
    font-weight: 600;
    margin-bottom: 4px;
  }

  .album-year {
    font-size: 12px;
    color: #7a5c8f;
  }

  /* 童话三部曲弹窗 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40, 20, 55, 0.45);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    background: #D9C3E8;
    border: 1px solid #b89cc9;
    border-radius: 6px;
    padding: 24px 22px 20px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    position: relative;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 600;
    color: #4a2e5e;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #b89cc9;
  }

  .modal-option {
    display: block;
    padding: 10px 14px;
    margin-bottom: 8px;
    background: #e6d5f0;
    border: 1px solid #c9aede;
    border-radius: 4px;
    color: #4a2e5e;
    text-decoration: none;
    font-size: 14px;
  }

  .modal-option:hover { background: #dcc8ea; }

  .modal-close {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    font-size: 18px;
    color: #6b4f7d;
    cursor: pointer;
    line-height: 1;
  }

  .modal-close:hover { color: #1f0f2b; }

  .disclaimer {
    position: fixed;
    bottom: 14px;
    right: 18px;
    font-size: 12px;
    color: #6b4f7d;
    background: rgba(217, 195, 232, 0.9);
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid #b89cc9;
    z-index: 999;
  }

  @media (max-width: 760px) {
    .topbar {
      flex-direction: column;
      height: auto;
      padding: 10px 16px;
      gap: 8px;
      align-items: flex-start;
    }
    .top-right {
      width: 100%;
      justify-content: space-between;
      gap: 12px;
    }
    .nav-links { gap: 12px; flex-wrap: wrap; }
    .main { padding: 28px 16px 80px; }
    .disclaimer { bottom: 8px; right: 8px; font-size: 11px; }
  }
</style>
</head>

<script>
  function openModal() {
    document.getElementById('fairyModal').classList.add('active');
  }
  function closeModal() {
    document.getElementById('fairyModal').classList.remove('active');
  }
  // 点击遮罩层关闭
  document.getElementById('fairyModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
